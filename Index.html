<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f6f2; --surface: #fff; --ink: #16212b; --muted: #566573; --line: #dce3df;
  --brand: #2a6aa8; --brand-hover: #215890; --brand-soft: #e6eff8; --on-brand: #fff;
  --leaf: #86c232; --ok: #2c6e12; --ok-soft: #e6f3da; --bad: #b1233a; --bad-soft: #fcebee; --idle-soft: #eceff0;
  --shadow: 0 1px 2px rgb(22 33 43 / .06), 0 4px 16px rgb(22 33 43 / .05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e151d; --surface: #16202b; --ink: #e8eef3; --muted: #9aaab8; --line: #27364a;
    --brand: #7db4e8; --brand-hover: #98c4ee; --brand-soft: #1b2e44; --on-brand: #0a1826;
    --leaf: #9bd24a; --ok: #a6dc72; --ok-soft: #1c3016; --bad: #ff9aa9; --bad-soft: #3a1c24; --idle-soft: #212d3a;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 4px 16px rgb(0 0 0 / .3);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0 1rem; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  background: var(--bg); color: var(--ink); line-height: 1.6; word-break: keep-all;
  font-family: "Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
h1, h2, h3, p, ul, dl, dd { margin: 0; }
ul { padding: 0; list-style: none; }
button, input, textarea { font: inherit; color: inherit; }
header { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 1.5rem 0; }
.logo { background: #fff; border-radius: 1rem; padding: .5rem 1rem; box-shadow: var(--shadow); }
.logo img { display: block; width: 18rem; max-width: 100%; height: auto; }
nav { width: 100%; max-width: 28rem; display: flex; gap: .25rem; padding: .25rem; background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; box-shadow: var(--shadow); }
nav button { flex: 1; min-height: 2.75rem; border: 0; border-radius: .75rem; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; transition: background-color .15s, color .15s; }
nav button:hover { background: var(--brand-soft); color: var(--ink); }
nav button[aria-current="page"] { background: var(--brand); color: var(--on-brand); }
main { width: 100%; max-width: 42rem; flex: 1; padding-bottom: 4rem; }
footer { margin: 3rem 0 2rem; color: var(--muted); font-size: .875rem; text-align: center; }

.stack { display: flex; flex-direction: column; align-items: stretch; width: 100%; }
.row { display: flex; gap: .5rem; }
.wrap { flex-wrap: wrap; align-items: center; }
.between { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
.col { display: flex; flex-direction: column; gap: 1rem; }
.center { text-align: center; }
.muted { color: var(--muted); }
.bold { font-weight: 700; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ok-text { color: var(--ok); } .bad-text { color: var(--bad); }
.mt2 { margin-top: .5rem; } .mt3 { margin-top: .75rem; } .mt4 { margin-top: 1rem; } .mt5 { margin-top: 1.25rem; } .mt8 { margin-top: 2rem; } .mt10 { margin-top: 2.5rem; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; box-shadow: var(--shadow); padding: 1rem; }
.card.big { padding: 2rem; text-align: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 2.75rem; padding: .5rem 1.1rem; border-radius: .75rem; border: 1px solid transparent; font-weight: 600; cursor: pointer; transition: background-color .15s, border-color .15s, transform .12s, opacity .15s; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { cursor: not-allowed; opacity: .5; }
.btn.primary { background: var(--brand); color: var(--on-brand); }
.btn.primary:hover:not(:disabled) { background: var(--brand-hover); }
.btn.ghost { background: var(--surface); border-color: var(--line); }
.btn.ghost:hover:not(:disabled) { background: var(--brand-soft); border-color: var(--brand); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.danger:hover:not(:disabled) { border-color: var(--bad); }
.btn.danger-solid { background: var(--bad); color: var(--surface); }
.btn.danger-solid:hover:not(:disabled) { opacity: .88; }
.btn.lg { min-height: 3.5rem; font-size: 1.15rem; border-radius: .9rem; width: 100%; }
.btn.sm { min-height: 2.25rem; padding: .25rem .8rem; font-size: .9rem; }

.field { width: 100%; min-height: 2.75rem; padding: .55rem .8rem; border-radius: .75rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: border-color .15s, box-shadow .15s; }
.field:hover { border-color: var(--muted); }
.field:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 25%, transparent); }
textarea.field { resize: none; }
button.field { display: flex; align-items: center; justify-content: space-between; gap: .75rem; text-align: left; font-weight: 600; cursor: pointer; }
.date { width: 13rem; font-weight: 600; }
.label { display: flex; flex-direction: column; gap: .3rem; font-size: .9rem; font-weight: 600; color: var(--muted); }
.count { text-align: right; font-size: .75rem; color: var(--muted); margin-top: .25rem; }
.msg { margin-top: .5rem; font-weight: 600; }

.choice { flex: 1; min-height: 2.75rem; border-radius: .75rem; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; transition: background-color .15s, border-color .15s, transform .12s; }
.choice.auto { flex: none; padding: 0 1rem; }
.choice:hover:not(:disabled) { background: var(--brand-soft); }
.choice:disabled { opacity: .4; cursor: not-allowed; }
.choice:active { transform: scale(.97); }
.choice[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }

.pill { display: inline-flex; align-items: center; gap: .3rem; padding: .15rem .7rem; border-radius: 999px; font-size: .85rem; font-weight: 700; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.idle { background: var(--idle-soft); color: var(--muted); }
.pill.info { background: var(--brand-soft); color: var(--brand); }
.pill.big { width: 100%; justify-content: center; padding: .75rem; font-size: 1.15rem; }
.check-pop { width: 1.25rem; height: 1.25rem; animation: check-pop .35s ease-out; }

.detail { margin-top: .5rem; padding: .5rem .75rem; border-radius: .5rem; background: var(--idle-soft); color: var(--muted); font-size: .9rem; white-space: pre-wrap; }
.name-sub { font-size: .875rem; font-weight: 400; color: var(--muted); }
.date-title { text-align: center; }
.date-title .y { font-size: .875rem; font-weight: 600; color: var(--muted); }
.date-title .md { font-size: 2rem; font-weight: 800; letter-spacing: -.02em; }
.date-title .md span { margin-left: .5rem; color: var(--brand); }
.duty-name { font-size: 2.25rem; font-weight: 800; letter-spacing: -.02em; }
.grid2 { display: grid; gap: .75rem; }
@media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.duty-card { display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 1.25rem; }
.makeup { margin-top: 2.5rem; padding-top: 2rem; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 1rem; }
h1.title { font-size: 1.9rem; font-weight: 800; margin-bottom: 1rem; }
h2.sec { font-size: 1.5rem; font-weight: 800; }
h2.sub { font-size: 1.1rem; font-weight: 700; }
.stats { display: flex; gap: 1.25rem; text-align: center; }
.stats dt { font-size: .75rem; color: var(--muted); }
.stats dd { font-size: 1.25rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.member { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1rem; }
.member .info { flex: 1 1 10rem; min-width: 0; }

.modal-backdrop { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgb(8 14 22 / .55); animation: fade-in .18s ease-out; }
.modal { width: 100%; max-width: 28rem; max-height: 92vh; overflow-y: auto; padding: 1.5rem; border-radius: 1.25rem 1.25rem 0 0; background: var(--surface); color: var(--ink); box-shadow: 0 -8px 40px rgb(0 0 0 / .25); animation: sheet-up .22s cubic-bezier(.2, .9, .3, 1); }
.modal.narrow { max-width: 24rem; }
.modal h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 1rem; }
.modal h3 { font-size: 1.25rem; font-weight: 800; margin-bottom: .5rem; }
.actions { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1.25rem; }
@media (min-width: 640px) {
  .modal-backdrop { align-items: center; padding: 1rem; }
  .modal { border-radius: 1.25rem; animation-name: pop-in; }
}
.skeleton { border-radius: .75rem; background: var(--line); animation: pulse-soft 1.4s ease-in-out infinite; }
@keyframes fade-in { from { opacity: 0; } }
@keyframes sheet-up { from { transform: translateY(24px); opacity: 0; } }
@keyframes pop-in { from { transform: scale(.96); opacity: 0; } }
@keyframes pulse-soft { 50% { opacity: .5; } }
@keyframes check-pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>

<script>
const DAYS = ['월', '화', '수', '목', '금'];
const SHIFT = { 1: '점심 전', 3: '점심 후', 2: '저녁' };
const TIME = { 1: '12:30 ~ 13:00', 3: '13:00 ~ 13:20', 2: '18:00 ~ 18:20' };
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];

document.getElementById('logo').src = LOGO;

// ---------- 헬퍼 ----------
// 사용자 입력(이름, 특이사항)은 textContent로만 넣어서 HTML로 해석되지 않게 한다
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}

const api = (fn, ...args) =>
  new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...args));

const errText = (e) => '서버 오류가 발생했습니다. 잠시 후 다시 시도하세요. (' + ((e && e.message) || e) + ')';

const svg = (d, cls) => {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 20 20');
  s.setAttribute('fill', 'none');
  s.setAttribute('stroke', 'currentColor');
  s.setAttribute('stroke-width', '2.5');
  s.setAttribute('aria-hidden', 'true');
  s.setAttribute('class', cls);
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d);
  p.setAttribute('stroke-linecap', 'round');
  p.setAttribute('stroke-linejoin', 'round');
  s.append(p);
  return s;
};
const checkIcon = () => svg('M4 10.5l4 4 8-9', 'check-pop');
const chevron = () => { const s = svg('M5 8l5 5 5-5', ''); s.style.cssText = 'width:1rem;height:1rem;color:var(--muted)'; return s; };

const skeleton = (...heights) =>
  h('div', { role: 'status', 'aria-label': '불러오는 중', class: 'stack', style: 'gap:.75rem' },
    heights.map((x) => h('div', { class: 'skeleton', 'aria-hidden': 'true', style: 'height:' + x })));

// 요청 중에는 버튼을 잠그고 문구를 바꾼다
async function busy(btn, text, fn) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = text;
  try { return await fn(); } finally { btn.disabled = false; btn.textContent = label; }
}

// ---------- 모달 (바깥 클릭·Esc로 닫힘, 맨 위 모달만 닫는다) ----------
const stack = [];
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && stack.length) stack[stack.length - 1].tryClose();
});

function openModal({ label, narrow = false, alert = false, canClose = () => true }, build) {
  const opener = document.activeElement;
  const box = h('div', { class: 'modal' + (narrow ? ' narrow' : ''), role: alert ? 'alertdialog' : 'dialog', 'aria-modal': 'true', 'aria-label': label });
  const back = h('div', { class: 'modal-backdrop', onmousedown: (e) => e.target === back && entry.tryClose() }, box);
  const entry = {
    tryClose: () => canClose() && close(),
  };
  function close() {
    back.remove();
    stack.splice(stack.indexOf(entry), 1);
    if (opener && opener.focus) opener.focus();
  }
  stack.push(entry);
  document.body.append(back);
  build(box, close);
  const first = box.querySelector('input, textarea, button');
  if (first) first.focus();
}

function choice(label, options, value, onChange) {
  const row = h('div', { class: 'row' });
  const buttons = options.map((o) =>
    h('button', {
      type: 'button', class: 'choice', 'aria-pressed': String(o.value === value),
      onclick: () => {
        value = o.value;
        buttons.forEach((b, i) => b.setAttribute('aria-pressed', String(options[i].value === value)));
        onChange(value);
      },
    }, o.label));
  row.append(...buttons);
  return h('div', { class: 'label', role: 'group', 'aria-label': label }, label, row);
}

// ---------- 탭 ----------
const tabs = { home: ['출석체크', renderHome], admin: ['출석관리', renderAdmin], member: ['부원관리', renderMember] };
const nav = document.getElementById('nav');
const main = document.getElementById('main');
let token = 0;

async function show(name) {
  const mine = ++token;
  for (const b of nav.children) b.removeAttribute('aria-current');
  nav.querySelector('[data-tab="' + name + '"]').setAttribute('aria-current', 'page');
  main.replaceChildren(skeleton('1.5rem', '9rem', '3rem'));
  try {
    const el = await tabs[name][1]();
    if (mine === token) main.replaceChildren(el);
  } catch (e) {
    if (mine === token) main.replaceChildren(h('div', { class: 'card big' }, h('p', { class: 'bad-text bold' }, errText(e)), h('button', { class: 'btn ghost mt4', onclick: () => show(name) }, '다시 시도')));
  }
}
for (const [key, [label]] of Object.entries(tabs)) nav.append(h('button', { type: 'button', 'data-tab': key, onclick: () => show(key) }, label));

// ---------- 출석체크 ----------
function attendButton(m) {
  const slot = h('div', { style: 'width:100%' });
  const done = () => slot.replaceChildren(h('div', { class: 'pill ok big', role: 'status' }, checkIcon(), '출석 완료'));
  if (m.attended) done();
  else slot.append(h('button', { type: 'button', class: 'btn primary lg', onclick: open }, '출석하기'));

  function open() {
    let finished = false;
    openModal({ label: m.name + ' 출석' }, (box, close) => {
      const ta = h('textarea', { class: 'field mt2', id: 'detail', maxlength: '1000', rows: '5', 'aria-label': '특이사항' });
      const count = h('p', { class: 'count' }, '0 / 1000');
      ta.addEventListener('input', () => (count.textContent = ta.value.length + ' / 1000'));
      const msg = h('p', { role: 'status', class: 'msg' });
      const cancel = h('button', { type: 'button', class: 'btn ghost', onclick: close }, '취소');
      const go = h('button', { type: 'button', class: 'btn primary', onclick: confirmIt }, '출석 기록');

      function confirmIt() {
        let pending = false;
        openModal({ label: '출석 확인', alert: true, narrow: true, canClose: () => !pending }, (b2, close2) => {
          const ok = h('button', { type: 'button', class: 'btn primary' }, '확인');
          ok.onclick = async () => {
            pending = true;
            let r;
            try { r = await busy(ok, '저장 중...', () => api('api_attend', m.id, ta.value)); }
            catch (e) { r = { ok: false, message: errText(e) }; }
            pending = false;
            msg.textContent = r.message;
            msg.className = 'msg ' + (r.ok ? 'ok-text' : 'bad-text');
            close2();
            if (r.ok) {
              finished = true;
              ta.disabled = true;
              go.remove();
              cancel.textContent = '닫기';
              done();
            }
          };
          b2.append(
            h('h3', {}, m.name + ' 님, 출석할까요?'),
            h('p', { class: 'detail' }, '특이사항: ' + (ta.value.trim() || '없음')),
            h('div', { class: 'actions' }, h('button', { type: 'button', class: 'btn ghost', onclick: close2 }, '취소'), ok));
        });
      }
      box.append(h('h2', {}, m.name + ' 출석'), h('label', { class: 'label', for: 'detail' }, '특이사항'), ta, count, msg, h('div', { class: 'actions' }, cancel, go));
    });
  }
  return slot;
}

function makeupSection(d) {
  let userId = 0;
  const pickLabel = h('span', { class: 'muted' }, '부원 선택');
  const detail = h('textarea', { class: 'field', maxlength: '1000', rows: '3', 'aria-label': '특이사항' });
  const msg = h('p', { role: 'status', class: 'msg', style: 'margin:0' });
  const submit = h('button', { type: 'button', class: 'btn primary', disabled: true }, '보충 기록');
  let timer;

  const pick = h('button', { type: 'button', class: 'field', 'aria-haspopup': 'dialog', onclick: openPicker }, pickLabel, chevron());
  function openPicker() {
    openModal({ label: '부원 선택' }, (box, close) => {
      const groups = [1, 2, 3].map((g) => {
        const members = d.makeup.filter((m) => m.grade === g);
        return h('div', { role: 'group', 'aria-label': g + '학년' },
          h('p', { class: 'muted bold mt2' }, g + '학년'),
          members.length
            ? h('div', { class: 'row wrap' }, members.map((m) =>
                h('button', {
                  type: 'button', class: 'choice auto', disabled: m.onDuty, 'aria-pressed': String(userId === m.id),
                  onclick: () => {
                    userId = m.id;
                    pickLabel.textContent = m.name;
                    pickLabel.className = '';
                    submit.disabled = false;
                    close();
                  },
                }, m.name, m.onDuty && h('span', { style: 'font-size:.75rem;font-weight:400;margin-left:.25rem' }, '(현재 당번)'))))
            : h('p', { class: 'muted', style: 'font-size:.9rem' }, '부원 없음'));
      });
      box.append(h('h2', {}, '부원 선택'), h('div', { class: 'col' }, groups), h('div', { class: 'actions' }, h('button', { type: 'button', class: 'btn ghost', onclick: close }, '닫기')));
    });
  }

  submit.onclick = async () => {
    let r;
    try { r = await busy(submit, '저장 중...', () => api('api_makeup', userId, detail.value)); }
    catch (e) { r = { ok: false, message: errText(e) }; }
    msg.textContent = r.message;
    msg.className = 'msg ' + (r.ok ? 'ok-text' : 'bad-text');
    if (r.ok) detail.value = '';
    clearTimeout(timer);
    if (r.ok) timer = setTimeout(() => (msg.textContent = ''), 3000); // 성공 메시지만 사라진다
  };

  return h('section', { class: 'makeup', 'aria-labelledby': 'makeup-title' },
    h('h2', { class: 'sub', id: 'makeup-title' }, '보충 출석'),
    h('div', { class: 'label' }, '부원', pick),
    h('label', { class: 'label' }, '특이사항', detail),
    msg, submit);
}

async function renderHome() {
  const d = await api('api_home');
  const fmt = (o) => new Date().toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul', ...o });

  let duty;
  if (!d.current) {
    duty = h('section', { class: 'card big mt4' }, h('p', { class: 'bold', style: 'font-size:1.25rem' }, '없음'));
  } else {
    duty = h('section', { class: 'mt4', 'aria-labelledby': 'duty-title' },
      h('div', { class: 'between', style: 'padding:0 .25rem .75rem' },
        h('h2', { class: 'sub', id: 'duty-title' }, '지금 ' + SHIFT[d.current.shift] + ' 당번'),
        h('span', { class: 'pill info' }, TIME[d.current.shift])),
      d.duty.length
        ? h('ul', { class: 'grid2' }, d.duty.map((m) =>
            h('li', { class: 'card duty-card' }, h('span', { class: 'duty-name' }, m.name), attendButton(m))))
        : h('div', { class: 'card big' }, h('p', { class: 'bold', style: 'font-size:1.25rem' }, '오늘 ' + SHIFT[d.current.shift] + ' 당번은 없어요')));
  }

  return h('div', { class: 'stack' },
    h('h1', { class: 'sr-only' }, '출석체크'),
    h('div', { class: 'date-title' },
      h('p', { class: 'y' }, fmt({ year: 'numeric' })),
      h('p', { class: 'md' }, fmt({ month: 'long', day: 'numeric' }), h('span', {}, fmt({ weekday: 'long' })))),
    duty,
    makeupSection(d));
}

// ---------- 출석관리 ----------
let adminDate = '';

function detailLine(text) { return h('p', { class: 'detail' }, '특이사항: ' + text); }
function nameLine(u) { return h('span', { class: 'bold' }, u.name, ' ', h('span', { class: 'name-sub' }, u.grade + '학년')); }

async function renderAdmin() {
  const d = await api('api_admin', adminDate);
  adminDate = d.date;
  const picker = h('div', { class: 'row wrap' },
    h('input', {
      type: 'date', class: 'field date', value: d.date, 'aria-label': '날짜 선택',
      onchange: (e) => { if (e.target.value) { adminDate = e.target.value; show('admin'); } },
    }),
    h('button', { type: 'button', class: 'btn ghost', onclick: () => csvModal(d.today) }, 'CSV 내보내기'));
  const title = h('h1', { class: 'title' }, '출석 관리');

  if (!d.day) return h('div', { class: 'stack' }, title, picker, h('div', { class: 'card big mt5' }, h('p', { class: 'bold', style: 'font-size:1.1rem' }, '주말에는 당번이 없어요')));

  const duty = d.records.filter((r) => r.kind === 'duty');
  const makeup = d.records.filter((r) => r.kind === 'makeup');
  const absent = d.records.filter((r) => r.kind === 'absent');
  const onDuty = d.users.filter((u) => u.day === d.day);
  const madeUp = d.users.filter((u) => makeup.some((r) => r.userId === u.id));
  const weekday = DAYS[d.day - 1];

  const shiftSections = [1, 3, 2].map((shift) => {
    const members = onDuty.filter((u) => u.shift === shift);
    const present = members.filter((u) => duty.some((r) => r.userId === u.id)).length;
    return h('section', { class: 'mt5' },
      h('div', { class: 'between', style: 'padding:0 .25rem .5rem' },
        h('h3', { class: 'sub' }, SHIFT[shift]),
        members.length > 0 && h('span', { class: 'muted bold', style: 'font-size:.875rem' }, present + ' / ' + members.length + '명 출석')),
      members.length === 0
        ? h('p', { class: 'card muted' }, '당번 없음')
        : h('ul', { class: 'col', style: 'gap:.5rem' }, members.map((u) => {
            const rec = duty.find((r) => r.userId === u.id);
            const miss = absent.some((a) => a.userId === u.id && a.shift === shift);
            // 휴업일, 시험 기간 등 학사일정 때문에 결석을 기록하지 않는 날
            const free = !rec && !miss && d.exempt && (d.exempt.all || d.exempt.grades[u.grade]);
            return h('li', { class: 'card' },
              h('div', { class: 'between' }, nameLine(u), h('span', { class: 'pill ' + (rec ? 'ok' : miss ? 'bad' : free ? 'info' : 'idle') }, rec ? '출석' : miss ? '결석' : free ? '면제' : '미출석')),
              rec && rec.detail && detailLine(rec.detail));
          })));
  });

  return h('div', { class: 'stack' }, title, picker,
    h('h2', { class: 'sec mt8' }, d.date + ' ', h('span', { class: 'name-sub', style: 'font-size:inherit;font-weight:800;color:var(--brand)' }, '(' + weekday + ')'), ' 당번'),
    shiftSections,
    h('h2', { class: 'sec mt10' }, '보충'),
    h('ul', { class: 'col mt3', style: 'gap:.5rem' },
      madeUp.length === 0 && h('li', { class: 'card muted' }, '보충한 부원 없음'),
      madeUp.map((u) =>
        h('li', { class: 'card' },
          h('div', { class: 'between' }, nameLine(u), h('span', { class: 'pill info' }, '보충 완료')),
          makeup.filter((r) => r.userId === u.id).map((r) => r.detail && detailLine(r.detail))))));
}

function csvModal(today) {
  openModal({ label: 'CSV 내보내기' }, (box, close) => {
    const from = h('input', { type: 'date', class: 'field', value: today, 'aria-label': '시작일' });
    const to = h('input', { type: 'date', class: 'field', value: today, 'aria-label': '종료일' });
    const msg = h('p', { class: 'msg bad-text', role: 'status' });
    const go = h('button', { type: 'button', class: 'btn primary' }, '내려받기');
    go.onclick = async () => {
      msg.textContent = '';
      if (!from.value || !to.value || to.value < from.value) { msg.textContent = '종료일은 시작일 이후여야 합니다.'; return; }
      let r;
      try { r = await busy(go, '만드는 중...', () => api('api_csv', from.value, to.value)); }
      catch (e) { msg.textContent = errText(e); return; }
      if (!r.ok) { msg.textContent = r.message; return; }
      // BOM을 붙여야 엑셀에서 한글이 깨지지 않는다
      const a = h('a', { href: URL.createObjectURL(new Blob(['﻿' + r.csv], { type: 'text/csv;charset=utf-8' })), download: r.name });
      document.body.append(a);
      a.click();
      a.remove();
      close();
    };
    box.append(
      h('h2', { style: 'margin-bottom:.25rem' }, 'CSV 내보내기'),
      h('p', { class: 'muted', style: 'font-size:.9rem;margin-bottom:1rem' }, '선택한 기간의 정규 출석과 보충 출석을 내려받습니다.'),
      h('div', { class: 'col', style: 'gap:.75rem' }, h('label', { class: 'label' }, '시작일', from), h('label', { class: 'label' }, '종료일', to)),
      msg,
      h('div', { class: 'actions' }, h('button', { type: 'button', class: 'btn ghost', onclick: close }, '취소'), go));
  });
}

// ---------- 부원관리 ----------
function memberModal(member) {
  openModal({ label: member ? '부원 수정' : '부원 추가' }, (box, close) => {
    const f = member ? { ...member } : { name: '', grade: 1, day: 1, shift: 1 };
    const name = h('input', { class: 'field', value: f.name, 'aria-label': '이름' });
    const msg = h('p', { class: 'msg bad-text', role: 'status' });
    const save = h('button', { type: 'button', class: 'btn primary' }, member ? '저장' : '추가');
    save.onclick = async () => {
      const data = { name: name.value, grade: f.grade, day: f.day, shift: f.shift };
      let r;
      try { r = await busy(save, '저장 중...', () => (member ? api('api_updateMember', member.id, data) : api('api_addMember', data))); }
      catch (e) { r = { ok: false, message: errText(e) }; }
      if (r.ok) { close(); show('member'); } else msg.textContent = r.message;
    };
    box.append(
      h('h2', {}, member ? '부원 수정' : '부원 추가'),
      h('div', { class: 'col' },
        h('label', { class: 'label' }, '이름', name),
        choice('학년', [1, 2, 3].map((g) => ({ value: g, label: g + '학년' })), f.grade, (v) => (f.grade = v)),
        choice('요일', DAYS.map((d, i) => ({ value: i + 1, label: d })), f.day, (v) => (f.day = v)),
        choice('시간', [1, 3, 2].map((s) => ({ value: s, label: SHIFT[s] })), f.shift, (v) => (f.shift = v))),
      msg,
      h('div', { class: 'actions' }, h('button', { type: 'button', class: 'btn ghost', onclick: close }, '취소'), save));
  });
}

function deleteModal(m) {
  let pending = false;
  openModal({ label: '부원 삭제 확인', alert: true, narrow: true, canClose: () => !pending }, (box, close) => {
    const del = h('button', { type: 'button', class: 'btn danger-solid' }, '삭제');
    const cancel = h('button', { type: 'button', class: 'btn ghost', onclick: close }, '취소');
    del.onclick = async () => {
      pending = true;
      cancel.disabled = true;
      try { await busy(del, '삭제 중...', () => api('api_deleteMember', m.id)); }
      catch (e) { alert(errText(e)); }
      pending = false;
      close();
      show('member');
    };
    box.append(
      h('h3', {}, m.name + ' 부원을 삭제할까요?'),
      h('p', { class: 'muted', style: 'font-size:.9rem' }, '출석·보충·결석 기록도 함께 삭제되며 되돌릴 수 없습니다.'),
      h('div', { class: 'actions' }, cancel, del));
  });
}

async function renderMember() {
  const members = await api('api_members');
  const list = members.length === 0
    ? h('div', { class: 'card big' }, h('p', { class: 'bold' }, '등록된 부원이 없어요'), h('p', { class: 'muted', style: 'font-size:.9rem' }, '오른쪽 위 “부원 추가”로 시작해 보세요.'))
    : h('ul', { class: 'col', style: 'gap:.5rem' }, members.map((m) =>
        h('li', { class: 'card member' },
          h('div', { class: 'info' },
            h('p', { class: 'bold', style: 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap' }, m.name + ' ', h('span', { class: 'name-sub' }, m.grade + '학년')),
            h('p', { class: 'muted', style: 'font-size:.9rem' }, DAYS[m.day - 1] + '요일 · ' + SHIFT[m.shift])),
          h('dl', { class: 'stats' }, [['출석', m.workCount, 'ok-text'], ['보충', m.addCount, ''], ['결석', m.runCount, 'bad-text']].map(([l, v, c]) =>
            h('div', {}, h('dt', {}, l), h('dd', { class: c, style: c ? '' : 'color:var(--brand)' }, v)))),
          h('div', { class: 'row' },
            h('button', { type: 'button', class: 'btn ghost sm', onclick: () => memberModal(m) }, '수정'),
            h('button', { type: 'button', class: 'btn danger sm', onclick: () => deleteModal(m) }, '삭제')))));
  return h('div', { class: 'stack' },
    h('div', { class: 'between', style: 'margin-bottom:1rem' }, h('h1', { class: 'title', style: 'margin:0' }, '부원 관리'), h('button', { type: 'button', class: 'btn primary', onclick: () => memberModal() }, '+ 부원 추가')),
    list);
}

show('home');
</script>
</body>
</html>
